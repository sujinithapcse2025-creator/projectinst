{% extends "base.html" %}{% block title %}Set new password · Accessible Banking{% endblock %}
{% block content %}<section class="form-shell"><div class="form-heading"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Set a new password</h1><p>Choose a strong password you have not used for a real bank account.</p></div>
<form method="post" class="form-card"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label>New password<input name="password" type="password" autocomplete="new-password" required minlength="8"><small>8+ characters with uppercase, lowercase, number and symbol.</small></label>
<label>Confirm new password<input name="confirm_password" type="password" autocomplete="new-password" required minlength="8"></label>
<button class="button primary full-button" type="submit">Change password</button></form></section>{% endblock %}
