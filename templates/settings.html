{% extends "base.html" %}{% block title %}Accessibility settings · Accessible Banking{% endblock %}
{% block content %}<section class="form-shell"><div class="form-heading"><p class="eyebrow">MAKE IT YOURS</p><h1>Accessibility settings</h1><p>Adjust how the prototype looks and speaks. These preferences are saved to your demo profile.</p></div>
<form method="post" class="form-card"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Text size <output id="font-output">{{ preferences.font_size }}px</output><input type="range" name="font_size" id="font-size" min="16" max="32" step="2" value="{{ preferences.font_size }}"></label>
<label class="check-option"><input type="checkbox" name="high_contrast" {% if preferences.high_contrast %}checked{% endif %}><span><strong>High contrast mode</strong><small>Use stronger contrast for improved readability.</small></span></label>
<label class="check-option"><input type="checkbox" name="voice_enabled" {% if preferences.voice_enabled %}checked{% endif %}><span><strong>Voice guidance</strong><small>Allow the browser to read helper responses aloud.</small></span></label>
<label>Preferred language<select name="language">{% for lang in languages %}<option value="{{ lang }}" {% if preferences.language == lang %}selected{% endif %}>{{ lang }}</option>{% endfor %}</select><small>Language preference is saved. Some explanatory content remains in English in this prototype.</small></label>
<button class="button primary full-button" type="submit">Save preferences</button></form><p class="form-bottom outside"><a href="{{ url_for('dashboard') }}">← Return to dashboard</a></p></section>{% endblock %}
